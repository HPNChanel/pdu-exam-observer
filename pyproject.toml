[project]
name = "pdu-exam-observer"
version = "0.2.0"
description = "Local research-only PDU examination observer with M1 governance persistence"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "mediapipe==1.0.1",
  "pydantic==2.11.7",
  "sse-starlette==2.4.1",
  "uvicorn==0.35.0",
]

[project.scripts]
pdu-exam-observer = "pdu_exam_observer.launcher:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.10",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdu_exam_observer"]
include = [
  "src/pdu_exam_observer/assets/models/pose_landmarker_lite.task",
  "src/pdu_exam_observer/assets/models/blaze_face_short_range.tflite",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pdu_exam_observer"]
